services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kantor
      POSTGRES_PASSWORD: kantor123
      POSTGRES_DB: kantor_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata: